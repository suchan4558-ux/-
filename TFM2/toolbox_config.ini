# ============================================================================
#  Bows' Drafter's Toolbox - config
#  Read when the game starts; restart the game after editing.
# ============================================================================
#
# The mod rates every champion from the games played in your save and writes
# the result into your team's champion Tier list (S / A / B / C / D).
#
# Which games: all of the champion's games on the current patch - however many
# - then whole earlier patches, newest first, until it has at least
# tier_full_conf_matches games. It never reaches back past the last patch that
# changed the champion (read from the game's patch notes, skill-only changes
# included): games from before a change describe a different champion.
#
#   rate  = wins / games
#   score = (wins + tier_full_conf_matches / 2) / (games + tier_full_conf_matches)
#
# So a champion with few games since its last change is drawn toward 50% until
# it has played enough for its win rate to be trusted, and a hot streak on a
# handful of games cannot put it in S. Under tier_min_matches: no tier.
#
# The games are every competition game played in the save, in every region -
# the same games the in-game Statistics tab counts. They are read once, then
# kept up to date. Solo queue is not used.

# Automatic tier list. false leaves your tier list completely alone; the
# patch badges, analyst tags and draft win rates keep working.
enabled=true

# Show a small green ▲ / red ▼ badge on champions the current patch buffed or
# nerfed, on the statistics page and the draft screen. Taken from the game's
# patch notes, so skill and cooldown changes count too.
patch_markers=true

# Show what the patch changed on a champion. In the draft, the champion panel at
# the bottom marks each changed stat in its header (e.g. "▼ -17/lv") and lists
# skill changes at the bottom of each skill card ("Cooldown 5 → 4"). In the
# Statistics tab, click a ▲/▼ badge for a popup with every change; click the
# popup (or the badge again) to close it.
patch_details=true

# In the draft, tag each enemy pick with the position your analyst expects it
# to play and how sure they are, e.g. "Mid 67%". Read from the analyst's
# lines in the staff dialogue, so it only works with the game in English.
analyst_reads=true

# On the draft grid, show each champion's adjusted win rate and games, e.g.
# "55% 42g", in its tier's colour. The rate is the score its tier comes from
# (see the formula at the top), so it matches tiers.txt. A champion with too
# few games to rate yet shows a dim grey "7/10g" instead: its games since its
# last change, out of the tier_min_matches needed.
draft_winrates=true

# In the Statistics tab (and the draft's stats popup), show each champion's
# adjusted win rate right after the game's own win rate, in its tier's colour.
# The game's column counts the patch you filter on; ours is the rating window
# above, the number the tier comes from.
statistics_winrates=true

# In the draft, six role buttons (all roles, then each position) switch the
# grid to that role: the win-rate pills show each champion's adjusted rate in
# it, the tier letters become its tier in that role, and the tier filter uses
# them. The game's tier filter is replaced by the mod's, which uses the mod's
# tier list rather than the game's copy that lags until in-game time moves.
draft_filters=true

# Add an "Advanced Stats" tab to the Statistics page: every champion ranked by
# its adjusted win rate, with its tier, the games it is rated on, its games this
# patch, its rate in each position and the last patch that changed it. Click a
# column to sort, and a champion to open its page: teammate and opponent lifts,
# game length, team strategies and pick / ban / presence rates, filterable by
# role. Click the tab again, or any of the game's tabs, to go back.
#
# In the draft, an "Advanced Stats" button in the bottom bar opens the same
# list over the draft screen, and right-clicking a champion on the draft grid
# opens its page. The draft timer keeps running while it is open.
#
# Lifts on a champion's page use the whole save history and, like the win
# rates, are drawn toward 0% until a pair has tier_full_conf_matches games and
# hidden under tier_min_matches.
advanced_stats=true

# Tier bands, on the score above (0.58 = 58%).
tier_s=0.54
tier_a=0.51
tier_b=0.49
tier_c=0.46

# Games the rating reaches for, and at which a win rate is taken at face value.
tier_full_conf_matches=100

# Games below which a champion gets no tier of its own.
tier_min_matches=10

# Let a champion's rating reach back past its last balance change: earlier
# patches still fill in while it lacks games (nine patches at most), but a buff
# or nerf no longer starts its window afresh. Off by default: games from before
# a change describe a different champion. The "Last changed" column and the
# patch badges are unaffected.
ignore_balance_changes=false

# The break-even win rate the score is centred on.
neutral=0.5
